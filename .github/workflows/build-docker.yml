name: build-docker

on:
  push:
    branches: [main, master, trunk]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Uts.Api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # no provenance+SBOM attestations — they appear as a phantom
          # unknown/unknown platform entry under the tag
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Notify webhook
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          curl -fsS -X POST ${{ secrets.WEBHOOK_URL }} \
          -H "Authorization: Bearer ${{ secrets.WEBHOOK_SECRET }}" 
